name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VER=$(cat VERSION | tr -d '\r\n')
          cat <<EOF > release_notes.md
          ## WinUtil Türkçe ${TAG_NAME}

          Windows 10 ve Windows 11 için çift dilli (**Türkçe / English**) toplu uygulama kurulumu (**240+ uygulama**), ince ayarlar, **4 alt sekmeli Wintoys tarzı Sistem & Bakım merkezi**, sistem yapılandırma, Windows Update profil yönetimi ve özel Windows 11 ISO/USB oluşturma aracı.

          ### ${TAG_NAME} Sürümündeki Büyük Yenilikler
          - **4 Alt Sekmeli Yeni \`Sistem & Bakım\` Merkezi:** **Özet & Donanım**, **Performans & Oyun**, **Temizlik & Ağ** ve **Başlangıç & Ayarlar** olarak tamamen yenilendi (tam Türkçe / English destekli).
          - **Özet & Donanım+:** **Pil Sağlığı (%) + HTML Pil Raporu**, Anakart / BIOS / Secure Boot / TPM / **Windows Lisans Özeti**, tüm sabit sürücülerin canlı doluluk çubukları ve **SSD S.M.A.R.T. sağlık/sıcaklık/aşınma** göstergeleri eklendi.
          - **Performans & Oyun+:** **Windows Oyun Modu**, **Pencereli Oyun Optimizasyonu (Win11)**, **MPO** anahtarları, **Canlı Güç Planı Seçici**, **Hazırda Bekletme (\`hiberfil.sys\`) boyutu & aç/kapa**, **Anlık RAM Temizleme** ve **GPU Sürücü Yenileme (\`Win+Ctrl+Shift+B\`)** eklendi.
          - **Temizlik & Ağ+:** **Tarayıcı Önbellek Temizleyici** (Chrome/Edge/Brave/Vivaldi/Opera/Firefox — şifreler korunur), **Windows Update Önbellek (\`SoftwareDistribution\`)**, **Eski Sürücü Temizliği (\`DriverStore\`)**, **Simge Önbelleği Onarımı**, **Tek Tıkla DNS Değiştirici** (Cloudflare, Google, AdGuard, Quad9, Otomatik), **Canlı DNS Ping Testi (ms)** ve **Ağ Sıfırlama** eklendi.
          - **Başlangıç & Ayarlar+:** Görev Yöneticisi uyumlu **Canlı Başlangıç (Startup) Uygulamaları Yöneticisi**, 5 yeni Gezgin/Gizlilik anahtarı (*Bu Bilgisayar ile aç, dosya uzantıları, gizli dosyalar, klasik sağ tık menüsü, Pano Geçmişi*) ve tek tıkla **Tanrı Modu (God Mode)** klasörü oluşturucu eklendi.

          ### Hızlı Kullanım
          - **Tek Dosya \`.exe\`:** Aşağıdaki \`WinUtil-TR.exe\` dosyasını indirip çift tıklayın.
          - **PowerShell Tek Satır:**
            \`\`\`powershell
            irm https://raw.githubusercontent.com/edizdar/winutil-tr/main/winutil.ps1 | iex
            \`\`\`

          📚 **Ayrıntılı Türkçe Rehber:** [rehber/](https://github.com/edizdar/winutil-tr/tree/main/rehber) · 📋 **Tüm Sürüm Geçmişi:** [CHANGELOG.md](https://github.com/edizdar/winutil-tr/blob/main/CHANGELOG.md)

          **Sürüm:** \`v${VER}\` · **Hazırlayan:** Erol Dizdar (https://www.eroldizdar.tr/) · **Esinlenme:** [ChrisTitusTech](https://github.com/christitustech/winutil)
          EOF

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "WinUtil Türkçe ${TAG_NAME}" --notes-file release_notes.md --latest
            gh release upload "$TAG_NAME" WinUtil-TR.exe winutil.ps1 --clobber
          else
            gh release create "$TAG_NAME" WinUtil-TR.exe winutil.ps1 \
              --title "WinUtil Türkçe ${TAG_NAME}" \
              --notes-file release_notes.md \
              --latest
          fi
