name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VER=$(cat VERSION | tr -d '\r\n')
          cat <<EOF > release_notes.md
          ## WinUtil Türkçe ${TAG_NAME}

          Windows 10 ve Windows 11 için çift dilli (**Türkçe / English**) toplu uygulama kurulumu (**240+ uygulama**), ince ayarlar, **4 alt sekmeli Wintoys tarzı Sistem & Bakım merkezi**, sistem yapılandırma, Windows Update profil yönetimi ve özel Windows 11 ISO/USB oluşturma aracı.

          ### ${TAG_NAME} Sürümündeki Kararlılık ve Kalite Güncellemeleri
          - **Sürücü Temizleyici (`DriverStore`) Dayanıklılık Düzeltmesi:** Standart dışı OEM sürücü sürüm biçimlerinde hata oluşmasını önleyen güvenli sürüm ayrıştırma (`TryParse`) eklendi.
          - **%100 Çift Dilli Araç İpuçları (ToolTips):** İngilizce modda Türkçe kalan pencere büyütme ipucu, İnce Ayarlar DNS açıklaması ve `Sistem & Bakım` sekmesindeki tüm 24 araç ipucu tam Türkçe / İngilizce olarak eşitlendi.
          - **PowerShell 5.1 Kodlama Hijyeni:** XAML yorumlarındaki Windows-1254 riskli karakterler temizlendi; tüm 133 betik ve derlenmiş `winutil.ps1` **0 AST hatası** ve **0 riskli bayt** ile doğrulandı.
          - **Canlı Uçtan Uca (E2E) Doğrulama:** Tüm 7 sekme, 4 alt sekme, Türkçe/İngilizce canlı geçiş, Dark/Light tema, arama/seçim sayaçları ve kayıt defteri dokunulmazlığı otomatik testlerle **%100 geçer** olarak doğrulandı.

          ### Hızlı Kullanım
          - **Tek Dosya \`.exe\`:** Aşağıdaki \`WinUtil-TR.exe\` dosyasını indirip çift tıklayın.
          - **PowerShell Tek Satır:**
            \`\`\`powershell
            irm https://raw.githubusercontent.com/edizdar/winutil-tr/main/winutil.ps1 | iex
            \`\`\`

          📚 **Ayrıntılı Türkçe Rehber:** [rehber/](https://github.com/edizdar/winutil-tr/tree/main/rehber) · 📋 **Tüm Sürüm Geçmişi:** [CHANGELOG.md](https://github.com/edizdar/winutil-tr/blob/main/CHANGELOG.md)

          **Sürüm:** \`v${VER}\` · **Hazırlayan:** Erol Dizdar (https://www.eroldizdar.tr/) · **Esinlenme:** [ChrisTitusTech](https://github.com/christitustech/winutil)
          EOF

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "WinUtil Türkçe ${TAG_NAME}" --notes-file release_notes.md --latest
            gh release upload "$TAG_NAME" WinUtil-TR.exe winutil.ps1 --clobber
          else
            gh release create "$TAG_NAME" WinUtil-TR.exe winutil.ps1 \
              --title "WinUtil Türkçe ${TAG_NAME}" \
              --notes-file release_notes.md \
              --latest
          fi
