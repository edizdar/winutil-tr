name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VER=$(cat VERSION | tr -d '\r\n')
          cat <<EOF > release_notes.md
          ## WinUtil Türkçe ${TAG_NAME}

          Windows 10 ve Windows 11 için çift dilli (**Türkçe / English**) ince ayarlar, **6 alt sekmeli Wintoys tarzı Sistem & Bakım merkezi**, **Derin Kaldırıcı (Program Ekle/Kaldır + Regedit/AppData/TEMP)**, Windows Update profilleri, sistem yapılandırma, özel Windows 11 ISO/USB oluşturma, **240+ toplu uygulama kurulumu** ve **canlı GitHub \`Uygulamalarım\` kataloğu**.

          ### ${TAG_NAME} Sürümündeki Büyük Yenilik
          - **Yeni \`Uygulamalarım\` Üst Sekmesi (\`Alt+U\`):** [github.com/edizdar](https://github.com/edizdar?tab=repositories) üzerindeki tüm herkese açık projeleri ve en son GitHub Release sürümlerini canlı olarak çeker (yeni bir proje veya sürüm yayımlandığında uygulama güncellemesi gerekmeden otomatik görünür).
          - **Tek Tıkla Kur / İndir:** Windows (\`.exe\`/\`.msi\`) projelerini canlı ilerleme çubuğuyla indirip çalıştırma, Android (\`.apk\`) projelerinin en son sürümünü indirip klasörde açma, platform filtreleri (*Tümü / Windows / Android / Kaynak Kod*) ve doğrudan GitHub sayfası kısayolu.

          ### Hızlı Kullanım
          - **Tek Dosya \`.exe\`:** Aşağıdaki \`WinUtil-TR.exe\` dosyasını indirip çift tıklayın.
          - **PowerShell Tek Satır:**
            \`\`\`powershell
            irm https://raw.githubusercontent.com/edizdar/winutil-tr/main/winutil.ps1 | iex
            \`\`\`

          📚 **Ayrıntılı Türkçe Rehber:** [rehber/](https://github.com/edizdar/winutil-tr/tree/main/rehber) · 📋 **Tüm Sürüm Geçmişi:** [CHANGELOG.md](https://github.com/edizdar/winutil-tr/blob/main/CHANGELOG.md)

          **Sürüm:** \`v${VER}\` · **Hazırlayan:** Erol Dizdar (https://www.eroldizdar.tr/) · **Esinlenme:** [ChrisTitusTech](https://github.com/christitustech/winutil)
          EOF

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "WinUtil Türkçe ${TAG_NAME}" --notes-file release_notes.md --latest
            gh release upload "$TAG_NAME" WinUtil-TR.exe winutil.ps1 --clobber
          else
            gh release create "$TAG_NAME" WinUtil-TR.exe winutil.ps1 \
              --title "WinUtil Türkçe ${TAG_NAME}" \
              --notes-file release_notes.md \
              --latest
          fi
