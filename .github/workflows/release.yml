name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VER=$(cat VERSION | tr -d '\r\n')
          cat <<EOF > release_notes.md
          ## WinUtil Türkçe ${TAG_NAME}

          Windows 10 ve Windows 11 için çift dilli (**Türkçe / English**) toplu uygulama kurulumu (**240+ uygulama**), ince ayarlar, **5 alt sekmeli Wintoys tarzı Sistem & Bakım merkezi**, **Derin Kaldırıcı (Program Ekle/Kaldır + Regedit/AppData/TEMP)**, sistem yapılandırma, Windows Update profil yönetimi ve özel Windows 11 ISO/USB oluşturma aracı.

          ### ${TAG_NAME} Sürümündeki Yenilikler ve Düzeltmeler
          - **Yeni \`Yüklü Programlar\` ve Derin Kaldırıcı (\`Sistem & Bakım\` 5. Alt Sekme):** Bilgisayarınızdaki **tüm Windows Program Ekle/Kaldır uygulamalarını** canlı aramayla listeler; program kaldırıldıktan sonra geride kalan **Kurulum Klasörü, AppData/ProgramData, Kayıt Defteri (Regedit) ve TEMP** artıklarını tarayıp önizleme onayıyla güvenle temizler.
          - **Canlı Çalışma Ekranı (Spinner) Düzeltmesi:** Kurulum, Kaldırma, Katalog Taraması ve İnce Ayarlar çalışırken Türkçe iş adlarıyla da canlı bekleme ekranının görünmesi sağlandı.
          - **Kaldırma Onay Penceresi ve Meşgul Uyarısı Düzeltmesi:** Kaldırma onayında boş görünen uygulama adları düzeltildi; meşgul işlem uyarısı ve O&O ShutUp10++ durumları tam Türkçe/İngilizce yapıldı.
          - **Kurulum Sekmesi Netleştirme:** Katalog tarama butonu **"Katalogdan Kurulu Olanları Seç"** olarak güncellendi ve tarama sonunda net bilgilendirme eklendi.

          ### Hızlı Kullanım
          - **Tek Dosya \`.exe\`:** Aşağıdaki \`WinUtil-TR.exe\` dosyasını indirip çift tıklayın.
          - **PowerShell Tek Satır:**
            \`\`\`powershell
            irm https://raw.githubusercontent.com/edizdar/winutil-tr/main/winutil.ps1 | iex
            \`\`\`

          📚 **Ayrıntılı Türkçe Rehber:** [rehber/](https://github.com/edizdar/winutil-tr/tree/main/rehber) · 📋 **Tüm Sürüm Geçmişi:** [CHANGELOG.md](https://github.com/edizdar/winutil-tr/blob/main/CHANGELOG.md)

          **Sürüm:** \`v${VER}\` · **Hazırlayan:** Erol Dizdar (https://www.eroldizdar.tr/) · **Esinlenme:** [ChrisTitusTech](https://github.com/christitustech/winutil)
          EOF

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "WinUtil Türkçe ${TAG_NAME}" --notes-file release_notes.md --latest
            gh release upload "$TAG_NAME" WinUtil-TR.exe winutil.ps1 --clobber
          else
            gh release create "$TAG_NAME" WinUtil-TR.exe winutil.ps1 \
              --title "WinUtil Türkçe ${TAG_NAME}" \
              --notes-file release_notes.md \
              --latest
          fi
